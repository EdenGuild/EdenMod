name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to create the tag + Release

jobs:
  build:
    name: build mod jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Everything the Gradle build fetches from the network: the Gradle distribution (services.gradle.org),
      # plugins and libraries (Fabric, Maven Central, Modrinth and Terraformers mavens) and the Minecraft
      # jars, libraries and mappings that Loom pulls from Mojang. Verified: with these restored (plus the
      # Spotless cache below), the full build - format check, compile, tests, remap - succeeds with no
      # network at all. The key includes gradle.properties, which holds the Minecraft/Fabric/Loom versions
      # (and mod_version, so a release bump costs one fresh upload); restore-keys falls back to the newest
      # older entry so a version bump still starts from a warm cache. Saved only after a green run.
      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/jars-9
          key: gradle-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      # Spotless' Eclipse formatter fetches p2 metadata from download.eclipse.org on every clean runner,
      # and spotlessApply also runs before compileJava, so when that server is down (it was, Oct 2026)
      # every step below fails. The metadata is ~0.5 MB; the JDT jars themselves come from Maven Central.
      # The key tracks the Spotless/Eclipse config; restore-keys falls back to any older entry, so a
      # config change never leaves the job without a cache. Saved only after a green run.
      - name: Cache Spotless Eclipse p2 metadata
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/dev/equo
          key: spotless-p2-${{ hashFiles('build.gradle', 'eclipse-formatter.xml') }}
          restore-keys: |
            spotless-p2-

      # If, and only if, the formatter cannot be *downloaded* (Eclipse outage and no cached copy), skip
      # Spotless for the rest of this run instead of blocking the build. A genuine formatting violation
      # fails differently and still fails the job. Formatting is also enforced locally (pre-commit hook and
      # spotlessApply on every compile), so a skipped CI check is a warning, not a hole. Self-healing:
      # once Eclipse is reachable again the check simply runs as normal.
      - name: Check formatting
        shell: bash
        run: |
          set +e
          ./gradlew spotlessCheck --no-daemon 2>&1 | tee "$RUNNER_TEMP/spotless.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "Failed to load eclipse jdt formatter" "$RUNNER_TEMP/spotless.log"; then
            echo "::warning title=Spotless skipped::The Eclipse formatter could not be downloaded (download.eclipse.org unavailable, no cached copy). Formatting was NOT checked in CI this run."
            echo "SKIP_SPOTLESS=-x spotlessApply -x spotlessCheck" >> "$GITHUB_ENV"
            exit 0
          fi
          exit "$status"

      - name: Run tests
        run: ./gradlew test $SKIP_SPOTLESS --no-daemon --stacktrace

      - name: Check Fulcio cert freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew checkFulcioCert $SKIP_SPOTLESS --no-daemon

      - name: Build
        run: ./gradlew build $SKIP_SPOTLESS --no-daemon --stacktrace

      # The remapped mod jar, excluding the -sources jar.
      - name: Stage release jar
        id: jar
        run: |
          jar=$(ls build/libs/edenmod-*.jar | grep -v -- '-sources' | head -n1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Built $jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edenmod-jar
          path: ${{ steps.jar.outputs.path }}

      # --- Auto-release on a version bump -------------------------------------
      # On master, read mod_version from gradle.properties. If no release with the
      # matching tag (v<version>) exists yet, tag this commit and publish a Release
      # with the jar. So bumping the version in gradle.properties and pushing is all
      # it takes to cut a release — no manual `git tag` needed. Re-pushing without a
      # bump just rebuilds (the release already exists, so it is skipped).
      - name: Read mod version
        id: version
        if: github.ref == 'refs/heads/master'
        run: |
          v=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "ver=$v" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          # Versions containing -alpha, -beta, or -rc (optionally followed by digits)
          # are treated as pre-releases: the GitHub Release is marked pre-release and
          # Modrinth gets the appropriate version-type instead of "release".
          if echo "$v" | grep -qiE '\-(alpha|beta|rc)[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Mod version: $v  MC: $mc  Pre-release: $(echo "$v" | grep -qiE '\-(alpha|beta|rc)' && echo yes || echo no)"

      - name: Check whether the release already exists
        id: release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for ${{ steps.version.outputs.tag }} yet — will publish."
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/master' && steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "${{ steps.jar.outputs.path }}"

      - name: Publish to Modrinth
        if: github.ref == 'refs/heads/master' && steps.release.outputs.exists == 'false' && steps.version.outputs.prerelease == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: EdenMod ${{ steps.version.outputs.ver }}
          version: ${{ steps.version.outputs.ver }}
          version-type: release
          game-versions: ${{ steps.version.outputs.mc }}
          loaders: fabric
